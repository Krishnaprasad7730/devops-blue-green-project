apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "employee-api.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "employee-api.labels" . | nindent 4 }}
data:
  APP_VERSION: {{ .Values.app.version | quote }}
  APP_ENV: {{ .Values.app.environment | quote }}
