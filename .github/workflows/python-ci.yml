name: DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/sonarqube-integration
  pull_request:
    branches:
      - main
      - develop
      - feature/sonarqube-integration

permissions:
  contents: read

env:
  AWS_REGION: ap-south-2
  ECR_REPOSITORY: employee-api
  IMAGE_TAG: ${{ github.sha }}

jobs:
  security-and-test:
    name: Security Scan and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 1. Secret scanning
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Python setup
      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 3. Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx pytest-cov

      # 4. Unit tests and coverage
      - name: Run Pytest with Coverage
        run: |
          python -m pytest tests/ -v \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term

      # 5. SonarQube SAST
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      
            # 6. Terraform Infrastructure Security Scan
            
      - name: Checkov IaC Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          output_format: cli
          soft_fail: true

      # 6. Docker build
      - name: Build Docker Image
        run: |
          docker build -t employee-api:${{ github.sha }} .

      # 7. Container vulnerability scan
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: employee-api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      
      # 8. OWASP ZAP DAST SCAN
      - name: Create DAST Docker Network
        run: |
          docker network create dast-network

      - name: Start Application for DAST
        run: |
          docker run -d \
            --name employee-api-dast \
            --network dast-network \
            -p 8000:8000 \
            employee-api:${{ github.sha }}

      - name: Wait for Application Health
        run: |
          for i in {1..30}; do
            if docker exec employee-api-dast \
              python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"; then
              echo "Application is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "Application failed health check"
          docker logs employee-api-dast
          exit 1
      - name: Run Application Smoke Tests
        run: |
          echo "Testing application endpoints..."

          curl --fail --show-error http://localhost:8000/
          curl --fail --show-error http://localhost:8000/health
          curl --fail --show-error http://localhost:8000/version

          echo "All smoke tests passed."

      - name: Run OWASP ZAP Baseline Scan
        run: |
          mkdir -p reports
          chmod -R 777 reports

          docker run --rm \
            --network dast-network \
            -v "$PWD/reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://employee-api-dast:8000 \
            -J zap-report.json \
            -r zap-report.html

      - name: Upload ZAP Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup DAST Environment
        if: always()
        run: |
          docker rm -f employee-api-dast || true
          docker network rm dast-network || true

      # 8. Generate Software Bill of Materials
      - name: Generate SBOM using Syft
        uses: anchore/sbom-action@v0.24.3
        with:
          image: employee-api:${{ github.sha }}
          format: spdx-json
          output-file: employee-api.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # 9. Upload SBOM as GitHub artifact
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: employee-api-sbom-${{ github.sha }}
          path: employee-api.spdx.json
          retention-days: 14

  # AWS authentication and ECR publishing
  push-to-ecr:
    name: Push Image to Amazon ECR
    runs-on: ubuntu-latest
    needs: security-and-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::787391402924:role/GitHubActions-ECR-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Display Published Image
        run: |
          echo "Image published successfully:"
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"

      # 10. Get immutable image digest
      - name: Get ECR Image Digest
        id: image-digest
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "Unable to retrieve image digest"
            exit 1
          fi

          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY@$DIGEST"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # 11. Install Cosign
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      # 12. Sign Docker image
      - name: Sign Container Image
        env:
          IMAGE_URI: ${{ steps.image-digest.outputs.image_uri }}
        run: |
          cosign sign --yes "$IMAGE_URI"
