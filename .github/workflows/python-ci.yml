name: Python Application CI-CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Test and Build Docker Image

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # Step 1: Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run tests
      - name: Execute Pytest
        run: |
          python -m pytest tests/ -v

      # Step 5: Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t employee-api:${{ github.sha }} .

      # Step 6: Authenticate with AWS using OIDC
      - name: Configure AWS Credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::787391402924:role/GitHubActions-ECR-Role
          aws-region: ap-south-2

      # Step 7: Login to Amazon ECR
      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 8: Push Docker image to ECR
      - name: Push Docker Image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: employee-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag employee-api:${IMAGE_TAG} ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}