name: DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/sonarqube-integration
  pull_request:
    branches:
      - main
      - develop
      - feature/sonarqube-integration

permissions:
  contents: read

env:
  AWS_REGION: ap-south-2
  ECR_REPOSITORY: employee-api
  IMAGE_TAG: ${{ github.sha }}

jobs:
  security-and-test:
    name: Security Scan and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 1. Secret scanning
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Python setup
      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 3. Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx pytest-cov

      # 4. Unit tests and coverage
      - name: Run Pytest with Coverage
        run: |
          python -m pytest tests/ -v \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term

      # 5. SonarQube SAST
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      
            # 6. Terraform Infrastructure Security Scan
            
      - name: Checkov IaC Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          output_format: cli
          soft_fail: true

      # 6. Docker build
      - name: Build Docker Image
        run: |
          docker build -t employee-api:${{ github.sha }} .

      # 7. Container vulnerability scan
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: employee-api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # AWS authentication and ECR publishing
  push-to-ecr:
    name: Push Image to Amazon ECR
    runs-on: ubuntu-latest
    needs: security-and-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::787391402924:role/GitHubActions-ECR-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Display Published Image
        run: |
          echo "Image published successfully:"
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
